  <div class="modal-overlay" id="adminModalOverlay">
    <div class="modal">
      <div class="modal__head">
        <h3>Login Admin</h3>
        <button class="icon-btn" id="closeAdminModal">&times;</button>
      </div>
      <form id="adminForm" class="modal__form">
        <label>
          Email
          <input type="email" id="adminEmail" required autocomplete="username">
        </label>
        <label>
          Password
          <input type="password" id="adminPassword" required autocomplete="current-password">
        </label>
        <p class="modal__error" id="adminError" style="display:none;"></p>
        <button type="submit" class="btn btn--primary btn--block">Masuk</button>
      </form>
    </div>
  </div>
